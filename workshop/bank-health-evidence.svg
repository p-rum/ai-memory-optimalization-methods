<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-label="Vektorové pořadí textů a strukturované vazby bankovní platformy"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L8 4 Z" fill="#75dfc8"/></marker></defs><rect x="0" y="0" width="700" height="708" rx="12" fill="#152138" stroke="#465977" stroke-width="2"/><rect x="728" y="0" width="700" height="708" rx="12" fill="#152138" stroke="#465977" stroke-width="2"/><text x="24" y="40" fill="#edf3ff" font-family="DejaVu Sans" font-size="27">VEKTOR · co zní podobně?</text><text x="752" y="40" fill="#edf3ff" font-family="DejaVu Sans" font-size="24">GRAF + STAV · co je propojené a platné?</text><text x="24" y="72" fill="#a5b6d1" font-family="DejaVu Sans" font-size="19">TF-IDF: pořadí textů podle slov v otázce</text><text x="752" y="72" fill="#a5b6d1" font-family="DejaVu Sans" font-size="19">Volání kódu, datové zdroje a nasazená verze</text><rect x="24" y="100" width="650" height="98" rx="12" fill="#21334f" stroke="#ffb58c" stroke-width="2"/><text x="42" y="128" fill="#ffb58c" font-family="DejaVu Sans" font-size="20">1. doc-health-old</text><text x="42" y="157" fill="#a5b6d1" font-family="DejaVu Sans" font-size="18">podobnost 0.542</text><text x="42" y="183" fill="#edf3ff" font-family="DejaVu Sans" font-size="18">Starší pravidlo: platnost skončila.</text><rect x="24" y="212" width="650" height="98" rx="12" fill="#21334f" stroke="#ffb58c" stroke-width="2"/><text x="42" y="240" fill="#ffb58c" font-family="DejaVu Sans" font-size="20">2. doc-health-draft</text><text x="42" y="269" fill="#a5b6d1" font-family="DejaVu Sans" font-size="18">podobnost 0.335</text><text x="42" y="295" fill="#edf3ff" font-family="DejaVu Sans" font-size="18">Návrh pravidla: není nasazený.</text><rect x="24" y="324" width="650" height="98" rx="12" fill="#21334f" stroke="#ffb58c" stroke-width="2"/><text x="42" y="352" fill="#ffb58c" font-family="DejaVu Sans" font-size="2